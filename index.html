<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>

    <main>
        <section class="hero" id="home">
            <h1 class="hero_title">PORTABLE BIDET</h1>
            <div class="hero_img">
                <img src="img/portablebidet(2).png" alt="Portable Bidet">
                <h2>A clean ass in a world full of shitty asses.</h2>
            </div>
            
             <aside>
                <p></p>
            </aside>
        </section>
        <header class="header">
        <nav class="navbar">
            <ul class="nav-elements">
                <li><a href="#home">Home</a></li>
                <li><a href="#product">Product</a></li>
                <li><a href="#product">Details</a></li>             
                <li><a href="#kontakt">Kontakt</a></li>
            </ul>
        </nav>
    </header>
        <div class="gallery">
        <section class="product" id="product">
            <div class="gallery">
                <div class="slider">
                    <button class="slider_button prev" aria-label="Previous image">←</button>
                    <div class="slider_track">
                        <img src="img/portablebidet(2).png" alt="Portable Bidet">
                        <img src="img/portable_bidetnobackround.png" alt="Portable Bidet">
                    </div>
                    <button class="slider_button next" aria-label="Next image">→</button>
                </div>
                <div class="thumbnails">
                    <button class="thumb active" aria-label="Show image1">
                        <img src="img/portablebidet(2).png" alt="Thumbnail 1">
                    </button>
                    <button class="thumb" aria-label="Show image2">
                        <img src="img/portable_bidetnobackround.png" alt="Thumbnail 2">
                    </button>
                </div>
            </div>

            <div class="product_info">
                <h2>PORTABLE BIDET</h2>
                <p>Product details go here.</p>
                <p>Free shipping in Europe</p>
                <button class="buy_button">Buy Now</button>
            </div>
        </section> 
        </div>


        <section class="kontakt" id="kontakt">
            <form action="#" method="POST" class="my-form">
            <label for="name">Ihr Name</label>
            <input type="text" name="Name" id="name" required>
            <label for="email">Ihre E-Mail-Adresse</label>
            <input type="email" name="Email" id="email" required>
            <label for="message">Was möchten Sie uns mitteilen?</label>
            <textarea name="Nachricht" id="message" cols="30" rows="6"></textarea>
            <div class="btns-row">
                <button type="submit">Formular absenden</button>
            </div>
            </form>
        </section>
    </main>

</body>
</html>
